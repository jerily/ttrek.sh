AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ttrek registry and website using the shared tdevops Lambda runtime.

Parameters:
  RequestProfiling:
    Type: String
    Default: '1'
    AllowedValues: ['0', '1']
    Description: Temporarily log per-invocation application timings (adds tracing overhead).
  LoadingMode:
    Type: String
    Default: lazy
    AllowedValues: [lazy, eager]
    Description: Worker code/template loading policy, independent of encrypted configuration.
  FunctionName:
    Type: String
    Default: prod-Api-TtrekWebsite-Function
    AllowedPattern: '[A-Za-z0-9_-]{1,54}'
  Architecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]
    Description: Must match the native libraries in the packaged ZIP.
  BackupBucket:
    Type: String
    Default: jerily-ttrek-app
    Description: Must match BackupBucket in the PostgreSQL stack.
  ReleaseBucket:
    Type: String
    Default: jerily-ttrek-app
    Description: Must match releases.bucket in the packaged production configuration.

  ContentImagesBucket:
    Type: String
    Default: jerily-ttrek-app
    Description: Must match content_images.bucket in the packaged production configuration.
  ContentImagesPrefix:
    Type: String
    Default: ttrek/content/images
    AllowedPattern: '[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*'
    Description: Must match content_images.prefix (without leading or trailing slashes).
  CloudFrontStackName:
    Type: String
    Default: Infra-DevOps-TTREK-CloudFrontCDN
    Description: CDN stack exporting BaseUrl; deploy it before this application stack.
  BrowserAssetsPrefix:
    Type: String
    Default: cdn
    AllowedPattern: '[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*'
    Description: Must match content_images.assets_prefix and the CloudFront stack.
  AccountCleanupSchedule:
    Type: String
    Default: rate(5 minutes)
    Description: Frequency of bounded account cleanup; retention grace is configured in account.cleanup_grace_period.
  AccountCleanupState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Enable after the account schema has been initialized.

Resources:
  SiteLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FunctionName}
      RetentionInDays: 14

  SiteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${FunctionName}-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DecryptProductionConfig
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !ImportValue Infra-DevOps-TTREK-Keys-KMSMasterKeyArn
        - PolicyName: LambdaVpcAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ec2:CreateNetworkInterface, ec2:DescribeNetworkInterfaces, ec2:DescribeSubnets, ec2:DeleteNetworkInterface, ec2:AssignPrivateIpAddresses, ec2:UnassignPrivateIpAddresses]
                Resource: '*'
        - PolicyName: ReadReleaseArtifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ReleaseBucket}/ttrek/*
        - PolicyName: ContentImages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${ContentImagesBucket}/${ContentImagesPrefix}/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${ContentImagesBucket}
                Condition:
                  StringLike:
                    s3:prefix: !Sub ${ContentImagesPrefix}/*
        - PolicyName: SyncBrowserAssets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ContentImagesBucket}/${BrowserAssetsPrefix}/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${ContentImagesBucket}
                Condition:
                  StringLike:
                    s3:prefix: !Sub ${BrowserAssetsPrefix}/*
        - PolicyName: WriteTelemetryBackups
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${BackupBucket}/telemetry/backups/*
        - PolicyName: SendTransactionalEmail
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail, ses:SendTemplatedEmail]
                Resource:
                  - !ImportValue Infra-DevOps-TTREK-SES-IdentityArn
                  - !ImportValue Infra-DevOps-TTREK-SES-ConfigurationSetArn
        - PolicyName: AccountEmailQueue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage]
                Resource: !ImportValue Infra-DevOps-TTREK-SQS-QueueArn
              - Effect: Allow
                Action: lambda:InvokeFunction
                # Construct the ARN to avoid a Role <-> Function dependency cycle.
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}:DEFAULT
        - PolicyName: WriteFunctionLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt SiteLogs.Arn

  SiteSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${FunctionName}-scheduler
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default
      Policies:
        - PolicyName: InvokeSiteTask
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref SiteFunction.Alias

  # Keep the logical ID generated by the former SAM ScheduleV2 event so updates
  # reuse the existing schedule. Cleanup invokes the website's private task API.
  SiteFunctionAccountCleanup:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${FunctionName}-prune
      Description: Prune expired account registrations, sessions, CAPTCHA challenges, and counters after their retention grace.
      ScheduleExpression: !Ref AccountCleanupSchedule
      ScheduleExpressionTimezone: America/New_York
      State: !Ref AccountCleanupState
      FlexibleTimeWindow: {Mode: 'OFF'}
      Target:
        Arn: !Ref SiteFunction.Alias
        RoleArn: !GetAtt SiteSchedulerRole.Arn
        Input: '{"source":"ttrek.patch","task":"task_prune_accounts"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 300
          MaximumRetryAttempts: 2

  SiteFunctionEmailQueue:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${FunctionName}-emails
      Description: Recover queued account emails after missed callbacks or failed sends.
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      FlexibleTimeWindow: {Mode: 'OFF'}
      Target:
        Arn: !Ref SiteFunction.Alias
        RoleArn: !GetAtt SiteSchedulerRole.Arn
        Input: '{"source":"ttrek.patch","task":"task_process_email_queue"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 300
          MaximumRetryAttempts: 2

  SiteFunctionPackageTracker:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${FunctionName}-package-tracker
      Description: Refresh Package Tracker rankings and recipe download history.
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      FlexibleTimeWindow: {Mode: 'OFF'}
      Target:
        Arn: !Ref SiteFunction.Alias
        RoleArn: !GetAtt SiteSchedulerRole.Arn
        Input: '{"source":"ttrek.patch","task":"task_refresh_package_tracker"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 300
          MaximumRetryAttempts: 2

  SiteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      AutoPublishAlias: DEFAULT
      AutoPublishAliasAllProperties: true
      CodeUri: ../dist/ttrek-sh.zip
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [!Ref Architecture]
      Role: !GetAtt SiteRole.Arn
      MemorySize: 256
      Timeout: 300
      ReservedConcurrentExecutions: 50
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 3600
        MaximumRetryAttempts: 2
      VpcConfig:
        SubnetIds:
          - !ImportValue Infra-DevOps-TTREK-Base-PrivateSubnet1Id
        SecurityGroupIds:
          - !ImportValue Infra-DevOps-TTREK-Base-LambdaSecurityGroupId
      Environment:
        Variables:
          ENV: PROD
          TTREK_LOADING: !Ref LoadingMode
          TTREK_PROFILE: !Ref RequestProfiling
          CONTENT_IMAGES_CLOUDFRONT_URL:
            Fn::ImportValue: !Sub ${CloudFrontStackName}-BaseUrl
          TELEMETRY_BACKUP_BUCKET: !Ref BackupBucket

Outputs:
  FunctionArn:
    Value: !GetAtt SiteFunction.Arn
  FunctionAliasArn:
    Value: !Ref SiteFunction.Alias
