AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ttrek registry and website using the shared tdevops Lambda runtime.

Parameters:
  FunctionName:
    Type: String
    Default: prod-Api-TtrekWebsite-Function
    AllowedPattern: '[A-Za-z0-9_-]{1,54}'
  Architecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]
    Description: Must match the native libraries in the packaged ZIP.
  BackupBucket:
    Type: String
    Default: jerily-ttrek-app
    Description: Must match BackupBucket in the PostgreSQL stack.
  ReleaseBucket:
    Type: String
    Default: jerily-ttrek-app
    Description: Must match releases.bucket in the packaged production configuration.

  ContentImagesBucket:
    Type: String
    Default: jerily-ttrek-app
    Description: Must match content_images.bucket in the packaged production configuration.
  ContentImagesPrefix:
    Type: String
    Default: ttrek/content/images
    AllowedPattern: '[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*'
    Description: Must match content_images.prefix (without leading or trailing slashes).

Resources:
  SiteLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FunctionName}
      RetentionInDays: 14

  SiteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${FunctionName}-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DecryptProductionConfig
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !ImportValue Infra-DevOps-TTREK-Keys-KMSMasterKeyArn
        - PolicyName: LambdaVpcAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ec2:CreateNetworkInterface, ec2:DescribeNetworkInterfaces, ec2:DescribeSubnets, ec2:DeleteNetworkInterface, ec2:AssignPrivateIpAddresses, ec2:UnassignPrivateIpAddresses]
                Resource: '*'
        - PolicyName: ReadReleaseArtifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ReleaseBucket}/ttrek/*
        - PolicyName: ContentImages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${ContentImagesBucket}
                Condition:
                  StringLike:
                    s3:prefix: !Sub ${ContentImagesPrefix}/*
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${ContentImagesBucket}/${ContentImagesPrefix}/*
        - PolicyName: WriteTelemetryBackups
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${BackupBucket}/telemetry/backups/*
        - PolicyName: SendTransactionalEmail
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail, ses:SendTemplatedEmail]
                Resource:
                  - !ImportValue Infra-DevOps-TTREK-SES-IdentityArn
                  - !ImportValue Infra-DevOps-TTREK-SES-ConfigurationSetArn
        - PolicyName: WriteFunctionLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt SiteLogs.Arn

  SiteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      CodeUri: ../dist/ttrek-sh.zip
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [!Ref Architecture]
      Role: !GetAtt SiteRole.Arn
      MemorySize: 256
      Timeout: 300
      ReservedConcurrentExecutions: 50
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 3600
        MaximumRetryAttempts: 2
      VpcConfig:
        SubnetIds:
          - !ImportValue Infra-DevOps-TTREK-Base-PrivateSubnet1Id
        SecurityGroupIds:
          - !ImportValue Infra-DevOps-TTREK-Base-LambdaSecurityGroupId
      Environment:
        Variables:
          ENV: PROD
          TELEMETRY_BACKUP_BUCKET: !Ref BackupBucket

Outputs:
  FunctionArn:
    Value: !GetAtt SiteFunction.Arn
