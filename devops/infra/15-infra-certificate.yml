AWSTemplateFormatVersion: '2010-09-09'
Description: DNS-validated ACM certificate for the regional ttrek.sh HTTP API.

Parameters:
  DomainName:
    Type: String
    Default: ttrek.sh
  HostedZoneId:
    Type: String
    Default: ''
    Description: Optional public Route 53 zone ID in this account; otherwise add ACM's validation CNAME manually.

Conditions:
  UseRoute53: !Not [!Equals [!Ref HostedZoneId, '']]

Resources:
  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - UseRoute53
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
        - !Ref AWS::NoValue

Outputs:
  CertificateArn:
    Value: !Ref SiteCertificate
    Export:
      Name: !Sub ${AWS::StackName}-CertificateArn
