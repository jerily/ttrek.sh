AWSTemplateFormatVersion: "2010-09-09"
Description: "S3 artifact and distribution bucket for TTrek"

Metadata:
  StackName: "Infra-DevOps-TTREK-Storage"

Parameters:
  S3Prefix:
    Type: String
    Default: "jerily"
  AppName:
    Type: String
    Default: "ttrek-app"

Resources:
  TTrekBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${S3Prefix}-${AppName}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTelemetryBackupsAfterSevenDays
            Status: Enabled
            Prefix: telemetry/backups/
            ExpirationInDays: 7
      Tags:
        - Key: Name
          Value: !Ref AppName

Outputs:
  TTrekBucketArn:
    Description: "TTrek S3 Bucket"
    Value: !GetAtt TTrekBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BucketArn"
