AWSTemplateFormatVersion: '2010-09-09'
Description: Single-AZ telemetry PostgreSQL with website-scheduled JSONL backups and vacuum.

Parameters:
  DatabasePassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 128
    Description: Read from /ttrek_sh/prod/postgres/password (SecureString) by the deploy script.
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
  BackupBucket:
    Type: String
    Default: jerily-ttrek-app
  WebsiteFunctionName:
    Type: String
    Default: prod-Api-TtrekWebsite-Function
  ScheduleTimezone:
    Type: String
    Default: America/New_York
  MaintenanceSchedule:
    Type: String
    Default: cron(0 5 * * ? *)

Resources:
  PostgresSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Preserve the deployed description; changing it replaces the group.
      GroupDescription: Telemetry PostgreSQL; application and maintenance Lambda only
      VpcId: !ImportValue Infra-DevOps-TTREK-Base-Vpc0Id
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 1
          ToPort: 1
          CidrIp: 127.0.0.1/32
  ApplicationDatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref PostgresSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !ImportValue Infra-DevOps-TTREK-Base-LambdaSecurityGroupId
  ApplicationDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !ImportValue Infra-DevOps-TTREK-Base-LambdaSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref PostgresSecurityGroup
  PostgresSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Two AZs required by RDS, one active database instance
      SubnetIds:
        - !ImportValue Infra-DevOps-TTREK-Base-PrivateSubnet1Id
        - !ImportValue Infra-DevOps-TTREK-Base-PrivateSubnet2Id
  PostgresParameters:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Require TLS and keep autovacuum enabled throughout the day
      Family: postgres17
      Parameters:
        rds.force_ssl: '1'
        autovacuum: '1'
  PostgresDBInstance:
    Type: AWS::RDS::DBInstance
    Metadata:
      cfn-lint:
        config:
          # A major-only version selects RDS's current default minor, not 17.0.
          # The deploy script supplies SSM SecureString via stdin to NoEcho.
          ignore_checks: [W3691, W1011]
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: ttrek-prod-postgres
      DBName: ttrek_telemetry
      Engine: postgres
      EngineVersion: '17'
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: '20'
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: ttrek_admin
      MasterUserPassword: !Ref DatabasePassword
      Port: '5432'
      PubliclyAccessible: false
      MultiAZ: false
      AvailabilityZone: !Select [0, !GetAZs '']
      BackupRetentionPeriod: 7
      PreferredBackupWindow: '07:00-07:30'
      PreferredMaintenanceWindow: 'sun:08:00-sun:08:30'
      CopyTagsToSnapshot: true
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
      DBSubnetGroupName: !Ref PostgresSubnetGroup
      DBParameterGroupName: !Ref PostgresParameters
      VPCSecurityGroups: [!Ref PostgresSecurityGroup]
      EnableCloudwatchLogsExports: [postgresql]

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !ImportValue Infra-DevOps-TTREK-Base-Vpc0Id
      VpcEndpointType: Gateway
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      RouteTableIds: [!ImportValue Infra-DevOps-TTREK-Base-PrivateRouteTableId]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${BackupBucket}/telemetry/backups/*

  ApplicationS3Egress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !ImportValue Infra-DevOps-TTREK-Base-LambdaSecurityGroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      # This isolated route table reaches S3 through its gateway endpoint;
      # there is no default internet/NAT route. The endpoint limits the bucket.
      CidrIp: 0.0.0.0/0
  MaintenanceErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ttrek-telemetry-maintenance-errors
      AlarmDescription: Inspect website Lambda logs; an HTTP or maintenance invocation has failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref WebsiteFunctionName}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ttrek-telemetry-schedule
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default
      Policies:
        - PolicyName: InvokeMaintenance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${WebsiteFunctionName}
  DailyMaintenance:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: ttrek-telemetry-maintenance
      ScheduleExpression: !Ref MaintenanceSchedule
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      FlexibleTimeWindow: {Mode: 'OFF'}
      Target:
        Arn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${WebsiteFunctionName}
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"source":"ttrek.telemetry","action":"backup-vacuum"}'
        RetryPolicy: {MaximumEventAgeInSeconds: 3600, MaximumRetryAttempts: 2}

Outputs:
  PostgresDBEndpointAddress:
    Value: !GetAtt PostgresDBInstance.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-PostgresDBEndpointAddress
  PasswordParameter:
    Value: /ttrek_sh/prod/postgres/password
  BackupLocation:
    Value: !Sub s3://${BackupBucket}/telemetry/backups/
  WebsiteFunction:
    Value: !Ref WebsiteFunctionName
  DatabaseName:
    Value: ttrek_telemetry
  DatabaseUsername:
    Value: ttrek_admin
