AWSTemplateFormatVersion: '2010-09-09'
Description: Download ttrek from S3, build the registry website and deploy its SAM application.

Parameters:
  S3Prefix:
    Type: String
    Default: jerily
  AppName:
    Type: String
    Default: ttrek-app
  BranchName:
    Type: String
    Default: main
  PrivateRegistryRef:
    Type: String
    Default: main
  GitHubConnectionArn:
    Type: String
    Default: ''
    Description: Optional AWS CodeConnections GitHub App ARN; otherwise use the account's default GitHub credentials.

  LambdaStackName:
    Type: String
    Default: Infra-DevOps-TTREK-Lambda
  LambdaFunctionName:
    Type: String
    Default: prod-Api-TtrekWebsite-Function
    AllowedPattern: '[A-Za-z0-9_-]{1,54}'

Conditions:
  HasGitHubConnection: !Not [!Equals [!Ref GitHubConnectionArn, '']]

Resources:
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-CodeBuildRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
      Policies:
        - PolicyName: BuildAndDeployLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - !If
                - HasGitHubConnection
                - Effect: Allow
                  Action: [codeconnections:GetConnection, codeconnections:GetConnectionToken]
                  Resource: !Ref GitHubConnectionArn
                - !Ref AWS::NoValue
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/Infra-DevOps-TTREK-Builds:*
              - Effect: Allow
                Action: [s3:GetBucketLocation, s3:ListBucket]
                Resource: !Sub arn:${AWS::Partition}:s3:::${S3Prefix}-${AppName}
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${S3Prefix}-${AppName}/lambda/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::jerily-ttrek-app/ttrek/*
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${LambdaStackName}/*
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:ListTags
                  - lambda:TagResource
                  - lambda:UntagResource
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${LambdaFunctionName}
              - Effect: Allow
                Action: [iam:CreateRole, iam:DeleteRole, iam:GetRole, iam:UpdateAssumeRolePolicy, iam:PutRolePolicy, iam:GetRolePolicy, iam:DeleteRolePolicy, iam:TagRole, iam:UntagRole, iam:ListRolePolicies, iam:ListAttachedRolePolicies]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LambdaFunctionName}-execution
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LambdaFunctionName}-execution
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:DeleteLogGroup, logs:PutRetentionPolicy, logs:DeleteRetentionPolicy, logs:TagResource, logs:UntagResource, logs:ListTagsForResource]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${LambdaFunctionName}:*
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ttrek_sh/prod/*
              - Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt]
                Resource: !ImportValue Infra-DevOps-TTREK-Keys-KMSMasterKeyArn
              - Effect: Allow
                Action: [ec2:DescribeSecurityGroups, ec2:DescribeSubnets, ec2:DescribeVpcs, ec2:GetSecurityGroupsForVpc, ec2:DescribeNetworkInterfaces]
                Resource: '*'
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: Infra-DevOps-TTREK-Builds
      ServiceRole: !GetAtt CodeBuildRole.Arn
      ConcurrentBuildLimit: 1
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: TTREK_CONFIG_KMS_KEY
            Value: !ImportValue Infra-DevOps-TTREK-Keys-KMSMasterKeyArn
          - Name: SAM_STACK_NAME
            Value: !Ref LambdaStackName
          - Name: SAM_ARTIFACT_BUCKET
            Value: !Sub ${S3Prefix}-${AppName}
          - Name: LAMBDA_FUNCTION_NAME
            Value: !Ref LambdaFunctionName
      Source:
        Auth: !If [HasGitHubConnection, {Type: CODECONNECTIONS, Resource: !Ref GitHubConnectionArn}, !Ref AWS::NoValue]
        BuildSpec: devops/buildspec.yml
        Type: GITHUB
        Location: https://github.com/jerily/ttrek.sh.git
        GitCloneDepth: 1
        GitSubmodulesConfig:
          FetchSubmodules: true
        ReportBuildStatus: false
      SourceVersion: !Ref BranchName
      SecondarySources:
        - SourceIdentifier: PrivateRegistry
          Type: GITHUB
          Auth: !If [HasGitHubConnection, {Type: CODECONNECTIONS, Resource: !Ref GitHubConnectionArn}, !Ref AWS::NoValue]
          Location: https://github.com/jerily/private-ttrek-registry.git
          GitCloneDepth: 1
      SecondarySourceVersions:
        - SourceIdentifier: PrivateRegistry
          SourceVersion: !Ref PrivateRegistryRef
      TimeoutInMinutes: 300

Outputs:
  CodeBuildProject:
    Description: CodeBuild Project ARN
    Value: !GetAtt CodeBuildProject.Arn
    Export:
      Name: !Sub ${AWS::StackName}-CodeBuildProject-Arn
