AWSTemplateFormatVersion: '2010-09-09'
Description: Isolated Lambda, Valkey and RDS network; no NAT or internet gateway.

Parameters:
  AppName:
    Type: String
    Default: ttrek-app
  Vpc0CIDR:
    Type: String
    Default: 10.0.0.0/16
  PrivateSubnet1CIDR:
    Type: String
    Default: 10.0.3.0/24
  PrivateSubnet2CIDR:
    Type: String
    Default: 10.0.4.0/24

Resources:
  TTrekVpc0:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref Vpc0CIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-vpc0

  # Preserve the cache security group and its export when updating the VPC stack.
  TTrekVpc0SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: TTrek-Vpc0-SecurityGroup
      VpcId: !Ref TTrekVpc0
      # Suppress EC2's default allow-all egress. Replies are stateful.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 1
          ToPort: 1
          CidrIp: 127.0.0.1/32

  TTrekKmsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private KMS endpoint
      VpcId: !Ref TTrekVpc0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 1
          ToPort: 1
          CidrIp: 127.0.0.1/32

  TTrekLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda access to private application services
      VpcId: !Ref TTrekVpc0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          DestinationSecurityGroupId: !Ref TTrekVpc0SecurityGroup
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationSecurityGroupId: !Ref TTrekKmsSecurityGroup

  TTrekValkeyIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TTrekVpc0SecurityGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      SourceSecurityGroupId: !Ref TTrekLambdaSecurityGroup

  TTrekKmsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TTrekKmsSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref TTrekLambdaSecurityGroup

  TTrekPrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TTrekVpc0
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PrivateSubnet1CIDR
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-private-subnet-1

  TTrekPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TTrekVpc0

  # RDS requires two AZs even though the database is Single-AZ.
  TTrekPrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TTrekVpc0
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PrivateSubnet2CIDR
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-private-subnet-2

  TTrekPrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref TTrekPrivateRouteTable
      SubnetId: !Ref TTrekPrivateSubnet2

  TTrekPrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref TTrekPrivateRouteTable
      SubnetId: !Ref TTrekPrivateSubnet1

  TTrekKmsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref TTrekVpc0
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.kms
      PrivateDnsEnabled: true
      SubnetIds: [!Ref TTrekPrivateSubnet1]
      SecurityGroupIds: [!Ref TTrekKmsSecurityGroup]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: kms:Decrypt
            Resource: !ImportValue Infra-DevOps-TTREK-Keys-KMSMasterKeyArn

Outputs:
  TTrekVpc0Id:
    Value: !Ref TTrekVpc0
    Export:
      Name: !Sub ${AWS::StackName}-Vpc0Id
  TTrekPrivateSubnet1Id:
    Value: !Ref TTrekPrivateSubnet1
    Export:
      Name: !Sub ${AWS::StackName}-PrivateSubnet1Id
  TTrekPrivateSubnet2Id:
    Value: !Ref TTrekPrivateSubnet2
    Export:
      Name: !Sub ${AWS::StackName}-PrivateSubnet2Id
  TTrekPrivateRouteTableId:
    Value: !Ref TTrekPrivateRouteTable
    Export:
      Name: !Sub ${AWS::StackName}-PrivateRouteTableId
  TTrekVpc0SecurityGroupId:
    Value: !GetAtt TTrekVpc0SecurityGroup.GroupId
    Export:
      Name: !Sub ${AWS::StackName}-Vpc0SecurityGroupId
  TTrekLambdaSecurityGroupId:
    Value: !GetAtt TTrekLambdaSecurityGroup.GroupId
    Export:
      Name: !Sub ${AWS::StackName}-LambdaSecurityGroupId
