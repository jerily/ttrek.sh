AWSTemplateFormatVersion: '2010-09-09'
Description: Private Lambda, Valkey and RDS network with outbound HTTPS through NAT.

Parameters:
  AppName:
    Type: String
    Default: ttrek-app
  Vpc0CIDR:
    Type: String
    Default: 10.0.0.0/16
  PrivateSubnet1CIDR:
    Type: String
    Default: 10.0.3.0/24
  PrivateSubnet2CIDR:
    Type: String
    Default: 10.0.4.0/24
  PublicSubnetCIDR:
    Type: String
    Default: 10.0.1.0/24
  RetainInterfaceEndpoints:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Keep existing endpoints during the first NAT migration deployment.

Conditions:
  KeepInterfaceEndpoints: !Equals [!Ref RetainInterfaceEndpoints, 'true']

Resources:
  TTrekVpc0:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref Vpc0CIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-vpc0

  # Preserve the cache security group and its export when updating the VPC stack.
  TTrekVpc0SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: TTrek-Vpc0-SecurityGroup
      VpcId: !Ref TTrekVpc0
      # Suppress EC2's default allow-all egress. Replies are stateful.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 1
          ToPort: 1
          CidrIp: 127.0.0.1/32

  TTrekKmsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: KeepInterfaceEndpoints
    Properties:
      GroupDescription: Private KMS endpoint
      VpcId: !Ref TTrekVpc0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 1
          ToPort: 1
          CidrIp: 127.0.0.1/32

  TTrekSesSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: KeepInterfaceEndpoints
    Properties:
      GroupDescription: Private SES API endpoint
      VpcId: !Ref TTrekVpc0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 1
          ToPort: 1
          CidrIp: 127.0.0.1/32

  TTrekEmailQueueSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: KeepInterfaceEndpoints
    Properties:
      GroupDescription: Private SQS and Lambda API endpoints
      VpcId: !Ref TTrekVpc0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 1
          ToPort: 1
          CidrIp: 127.0.0.1/32

  TTrekLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Keep the deployed description: changing it replaces the group and breaks
      # the ID export imported by Lambda. The RDS stack owns PostgreSQL and
      # public HTTPS egress; do not duplicate its existing TCP 443 rule here.
      GroupDescription: Lambda access to Valkey and KMS only
      VpcId: !Ref TTrekVpc0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          DestinationSecurityGroupId: !Ref TTrekVpc0SecurityGroup
        - !If
          - KeepInterfaceEndpoints
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            DestinationSecurityGroupId: !Ref TTrekKmsSecurityGroup
          - !Ref AWS::NoValue
        - !If
          - KeepInterfaceEndpoints
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            DestinationSecurityGroupId: !Ref TTrekSesSecurityGroup
          - !Ref AWS::NoValue
        - !If
          - KeepInterfaceEndpoints
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            DestinationSecurityGroupId: !Ref TTrekEmailQueueSecurityGroup
          - !Ref AWS::NoValue

  TTrekValkeyIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TTrekVpc0SecurityGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      SourceSecurityGroupId: !Ref TTrekLambdaSecurityGroup

  TTrekKmsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: KeepInterfaceEndpoints
    Properties:
      GroupId: !Ref TTrekKmsSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref TTrekLambdaSecurityGroup

  TTrekSesIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: KeepInterfaceEndpoints
    Properties:
      GroupId: !Ref TTrekSesSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref TTrekLambdaSecurityGroup

  TTrekEmailQueueIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: KeepInterfaceEndpoints
    Properties:
      GroupId: !Ref TTrekEmailQueueSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref TTrekLambdaSecurityGroup

  TTrekInternetGateway:
    Type: AWS::EC2::InternetGateway

  TTrekInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref TTrekVpc0
      InternetGatewayId: !Ref TTrekInternetGateway

  # Only NAT occupies this subnet. Lambda, Valkey and RDS stay private.
  TTrekPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TTrekVpc0
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PublicSubnetCIDR
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-nat-subnet

  TTrekPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TTrekVpc0

  TTrekPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref TTrekPublicRouteTable
      SubnetId: !Ref TTrekPublicSubnet

  TTrekPublicInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: TTrekInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref TTrekPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref TTrekInternetGateway

  TTrekNatAddress:
    Type: AWS::EC2::EIP
    DependsOn: TTrekInternetGatewayAttachment
    Properties:
      Domain: vpc

  TTrekNatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn:
      - TTrekPublicInternetRoute
      - TTrekPublicSubnetRouteTableAssociation
    Properties:
      AllocationId: !GetAtt TTrekNatAddress.AllocationId
      SubnetId: !Ref TTrekPublicSubnet
      ConnectivityType: public
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-nat

  TTrekPrivateInternetRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref TTrekPrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref TTrekNatGateway

  TTrekPrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TTrekVpc0
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PrivateSubnet1CIDR
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-private-subnet-1

  TTrekPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TTrekVpc0

  # RDS requires two AZs even though the database is Single-AZ.
  TTrekPrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TTrekVpc0
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PrivateSubnet2CIDR
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-private-subnet-2

  TTrekPrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref TTrekPrivateRouteTable
      SubnetId: !Ref TTrekPrivateSubnet2

  TTrekPrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref TTrekPrivateRouteTable
      SubnetId: !Ref TTrekPrivateSubnet1

  TTrekKmsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: KeepInterfaceEndpoints
    Properties:
      VpcId: !Ref TTrekVpc0
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.kms
      PrivateDnsEnabled: true
      SubnetIds: [!Ref TTrekPrivateSubnet1]
      SecurityGroupIds: [!Ref TTrekKmsSecurityGroup]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: kms:Decrypt
            Resource: !ImportValue Infra-DevOps-TTREK-Keys-KMSMasterKeyArn

  TTrekSesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: KeepInterfaceEndpoints
    Properties:
      VpcId: !Ref TTrekVpc0
      VpcEndpointType: Interface
      # awsses uses the HTTPS API, not the email-smtp service.
      ServiceName: !Sub com.amazonaws.${AWS::Region}.email
      PrivateDnsEnabled: true
      SubnetIds: [!Ref TTrekPrivateSubnet1]
      SecurityGroupIds: [!Ref TTrekSesSecurityGroup]
      # Sending permissions remain scoped by the Lambda execution role. Keep
      # this base stack independent of the SES identity stack's exports.

  # Temporary during migration; regional AWS APIs use NAT after removal.
  TTrekSqsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: KeepInterfaceEndpoints
    Properties:
      VpcId: !Ref TTrekVpc0
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sqs
      PrivateDnsEnabled: true
      SubnetIds: [!Ref TTrekPrivateSubnet1]
      SecurityGroupIds: [!Ref TTrekEmailQueueSecurityGroup]

  TTrekLambdaEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: KeepInterfaceEndpoints
    Properties:
      VpcId: !Ref TTrekVpc0
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.lambda
      PrivateDnsEnabled: true
      SubnetIds: [!Ref TTrekPrivateSubnet1]
      SecurityGroupIds: [!Ref TTrekEmailQueueSecurityGroup]

Outputs:
  TTrekVpc0Id:
    Value: !Ref TTrekVpc0
    Export:
      Name: !Sub ${AWS::StackName}-Vpc0Id
  TTrekPrivateSubnet1Id:
    Value: !Ref TTrekPrivateSubnet1
    Export:
      Name: !Sub ${AWS::StackName}-PrivateSubnet1Id
  TTrekPrivateSubnet2Id:
    Value: !Ref TTrekPrivateSubnet2
    Export:
      Name: !Sub ${AWS::StackName}-PrivateSubnet2Id
  TTrekPrivateRouteTableId:
    Value: !Ref TTrekPrivateRouteTable
    Export:
      Name: !Sub ${AWS::StackName}-PrivateRouteTableId
  TTrekVpc0SecurityGroupId:
    Value: !GetAtt TTrekVpc0SecurityGroup.GroupId
    Export:
      Name: !Sub ${AWS::StackName}-Vpc0SecurityGroupId
  TTrekLambdaSecurityGroupId:
    Value: !GetAtt TTrekLambdaSecurityGroup.GroupId
    Export:
      Name: !Sub ${AWS::StackName}-LambdaSecurityGroupId
