AWSTemplateFormatVersion: "2010-09-09"
Description: "KMS key for TTrek production configuration"

Metadata:
  StackName: "Infra-DevOps-TTREK-Keys"

Parameters:
  AppName:
    Type: String
    Default: "ttrek-app"

Resources:
  TTrekKMSMasterKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: "KMS Key for TTrek"
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - "kms:*"
            Resource: "*"
          - Sid: EncryptCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - 'kms:Encrypt*'
              - 'kms:Decrypt*'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:Describe*'
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*'

  TTrekKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AppName}-kms-key"
      TargetKeyId: !Ref TTrekKMSMasterKey


Outputs:
  TTrekKMSMasterKeyArn:
    Description: "TTrek KMS Key Arn"
    Value: !GetAtt TTrekKMSMasterKey.Arn
    Export:
      Name: !Sub "${AWS::StackName}-KMSMasterKeyArn"
  TTrekKMSMasterKeyId:
    Description: "TTrek KMS Key Id"
    Value: !Ref TTrekKMSMasterKey
    Export:
      Name: !Sub "${AWS::StackName}-KMSMasterKeyId"
