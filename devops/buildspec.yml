version: 0.2

env:
  shell: bash
  variables:
    SHELL: /bin/bash
  git-credential-helper: yes
phases:
  install:
    on-failure: ABORT
    runtime-versions:
      nodejs: 22
      python: 3.12
    commands:
      # Install ttrek's external build tools and the Lambda packaging utilities.
      # Allow the full curl package to replace AL2023's curl-minimal if present.
      - >-
        dnf install -y --allowerasing
        bash ca-certificates curl gcc gcc-c++ make git patch
        pkgconf-pkg-config perl tar gzip unzip zip binutils
      # Use pip for a recent CMake, alongside the SAM deployment CLI.
      - python3 -m pip install 'cmake>=3.25,<5' 'aws-sam-cli>=1.135,<2'
      - cmake --version
      - gcc --version
      - g++ --version
  build:
    on-failure: ABORT
    commands:
      # Validate and package the site; the explicit sync patch task uploads content images.
      - bash devops/build-lambda.sh
      - >-
        sam deploy --template-file devops/sam-template.yaml
        --stack-name "$SAM_STACK_NAME"
        --s3-bucket "$SAM_ARTIFACT_BUCKET" --s3-prefix lambda/ttrek-sh
        --region "$AWS_DEFAULT_REGION"
        --capabilities CAPABILITY_NAMED_IAM
        --parameter-overrides "FunctionName=$LAMBDA_FUNCTION_NAME" Architecture=x86_64
        --no-confirm-changeset --no-fail-on-empty-changeset
