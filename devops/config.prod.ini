# Input template only. tconfig resolves /ttrek_sh/prod/<section>/<key> in SSM.
# Required SSM values have no defaults. Never put credentials in this file.
[postgres]
host=
port=5432
database=ttrek_telemetry
username=ttrek_admin
password=
timeout=5000

[redis]
host=
port=6379
username=appuser
password=
ssl_ca_file=/etc/pki/tls/certs/ca-bundle.crt

[releases]
bucket=jerily-ttrek-app
region=eu-central-1
prefix=ttrek/1.3.0
version=1.3.0
url_expiry_seconds=300
checksums_file=etc/releases.json
source_prefix=ttrek/sources
source_url_expiry_seconds=300

[content_images]
bucket=jerily-ttrek-app
region=eu-central-1
docs_directory=content/docs
blog_directory=content/blog
prefix=ttrek/content/images
# Browser assets (favicon, CSS and JS) use a separate S3 prefix.
assets_prefix=cdn
url_expiry_seconds=3600
# PROD only; SAM imports the CDN base URL from the CloudFront stack.
cloudfront_enabled=true

[ratelimit]
window_millis=10000
limit=1000

[request_monitor]
store=valkey
master_template=request-monitor-master.html.jinja
history_max_events=100000
