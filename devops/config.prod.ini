# Input template only. tconfig resolves /ttrek_sh/prod/<section>/<key> in SSM.
# Required SSM values have no defaults. Never put credentials in this file.
[postgres]
host=
port=5432
database=ttrek_telemetry
username=ttrek_admin
password=
timeout=5000

[redis]
host=
port=6379
username=appuser
password=
ssl_ca_file=/etc/pki/tls/certs/ca-bundle.crt

[releases]
bucket=jerily-ttrek-app
region=eu-central-1
prefix=ttrek/1.9.0
version=1.9.0
url_expiry_seconds=300
checksums_file=etc/releases.json
source_prefix=ttrek/sources
source_url_expiry_seconds=300

[content_images]
bucket=jerily-ttrek-app
region=eu-central-1
docs_directory=content/docs
blog_directory=content/blog
prefix=ttrek/content/images
# Browser assets (favicon, CSS and JS) use a separate S3 prefix.
assets_prefix=cdn
url_expiry_seconds=3600
# PROD only; SAM imports the CDN base URL from the CloudFront stack.
cloudfront_enabled=true

[ratelimit]
window_millis=10000
limit=100

[request_monitor]
store=valkey
master_template=request-monitor-master.html.jinja
history_max_events=100000

[account]
db_dialect=postgres
secure_cookies=true
require_https_origin=true
allow_oauth_http=false
allow_loopback_origin=false
show_verification_codes=false
require_email_delivery=true
aws_email_enabled=true
# Google credentials and redirect URI are supplied through SSM.
google_enabled = true
google_client_id =
google_client_secret =
google_redirect_uri =

password_min_length=6
tenant=ttrek.sh
# Public site name for email subjects and authenticator apps.
issuer=ttrek.sh
registration_captcha=true
captcha_length=6
captcha_letters=true
login_captcha_after=3
login_captcha_window=900
cleanup_grace_period=3600
persistent_session_ttl=2592000
collect_names=true
collect_display_name=false
collect_username=false
email_verification_required=true
verification_emails_enabled=true
origin=https://ttrek.sh
email_enabled=true
email_login_enabled=true
# Sign in after the registration email code is verified when email login is enabled.
login_after_email_verification=true
email_from=noreply@ttrek.sh
email_region=eu-central-1
email_queue_enabled=true
# SSM SecureString: /ttrek_sh/prod/account/email_queue_url (queue URL, not ARN).
email_queue_url=
# Persistent SecureString values; never commit populated keysets or salts.
aead_keyset=
mac_keyset=
email_hash_salt=

[groups]
admin =

[permissions]
admin = admin_dashboard.manage, forum.moderate, wiki.edit, blog.edit, users.manage, request_monitor.view
