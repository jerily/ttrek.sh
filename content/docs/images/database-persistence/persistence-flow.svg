<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">How an app remembers a task</title>
  <desc id="desc">The app sends a task to tpersist, which builds SQL and uses a TDBC driver to store it in the database. When the app restarts, it reads the saved task from the database.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#47637c"/></marker>
  </defs>
  <rect width="960" height="470" rx="24" fill="#f4f7fb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172f46">
    <text x="40" y="51" font-size="29" font-weight="700">How an app remembers</text>
    <text x="40" y="84" font-size="19" fill="#47637c">Save a task now. Read it again after the app restarts.</text>

    <rect x="40" y="125" width="240" height="170" rx="18" fill="#fff" stroke="#a9c8e6" stroke-width="2"/>
    <rect x="64" y="147" width="35" height="35" rx="8" fill="#e6f1ff"/>
    <text x="81" y="172" text-anchor="middle" font-size="22" font-weight="700" fill="#215ea0">1</text>
    <text x="64" y="215" font-size="27" font-weight="700">Your Tcl app</text>
    <text x="64" y="246" font-size="19">“Water the plant”</text>
    <text x="64" y="273" font-size="17" fill="#47637c">Asks to save a task</text>

    <rect x="360" y="125" width="240" height="170" rx="18" fill="#fff" stroke="#a9c8e6" stroke-width="2"/>
    <rect x="384" y="147" width="35" height="35" rx="8" fill="#e6f1ff"/>
    <text x="401" y="172" text-anchor="middle" font-size="22" font-weight="700" fill="#215ea0">2</text>
    <text x="384" y="215" font-size="27" font-weight="700">tpersist</text>
    <text x="384" y="246" font-size="19">Builds the SQL</text>
    <text x="384" y="273" font-size="17" fill="#47637c">Connects through TDBC</text>

    <rect x="680" y="125" width="240" height="170" rx="18" fill="#e9f6ee" stroke="#94c4a4" stroke-width="2"/>
    <rect x="704" y="147" width="35" height="35" rx="8" fill="#d1ebda"/>
    <text x="721" y="172" text-anchor="middle" font-size="22" font-weight="700" fill="#26613c">3</text>
    <text x="704" y="215" font-size="27" font-weight="700">Database</text>
    <text x="704" y="246" font-size="19">Stores the task</text>
    <text x="704" y="273" font-size="17" fill="#47637c">SQLite or PostgreSQL</text>

    <path d="M290 207H348" fill="none" stroke="#47637c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M610 207H668" fill="none" stroke="#47637c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M800 309V351Q800 365 786 365H174Q160 365 160 351V309" fill="none" stroke="#47637c" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="265" y="347" width="430" height="35" rx="10" fill="#f4f7fb"/>
    <text x="480" y="371" text-anchor="middle" font-size="19" fill="#47637c">After restart: read the task through tpersist</text>
    <rect x="40" y="400" width="880" height="42" rx="12" fill="#e6f1ff"/>
    <text x="480" y="427" text-anchor="middle" font-size="20" font-weight="700">The app can stop. The saved record stays.</text>
  </g>
</svg>
