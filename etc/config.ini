# Used only with ENV=PROD. LOCAL telemetry uses data/telemetry.sqlite3.
[postgres]
host=
port=5432
database=ttrek_telemetry
username=ttrek_admin
password=

[request_monitor]
master_template=request-monitor-master.html.jinja
# Omit store for memory in LOCAL mode and Valkey in PROD mode.
# Maximum request events retained in the monitor history.
history_max_events=100000

[releases]
# Private distribution bucket; downloads use signed S3 URLs.
bucket=jerily-ttrek-app
region=eu-central-1
# S3 key prefix for release binaries.
prefix=ttrek/1.9.0
version=1.9.0
url_expiry_seconds=300
source_url_expiry_seconds=300
# S3 key prefix for source archives.
source_prefix=ttrek/sources
# Manifest containing checksums for the configured release.
checksums_file=etc/releases.json

[ssl]
certificate=
key=
[redis]
host=localhost
port=6379

username=appuser
password=
# CA bundle used to verify the Valkey TLS certificate.
ssl_ca_file=/etc/ssl/certs/ca-certificates.crt

[content_images]
# Sources are relative to this directory; paths cannot escape it.
docs_directory=content/docs
blog_directory=content/blog
bucket=jerily-ttrek-app
region=eu-central-1
prefix=ttrek/content/images
# Browser assets (favicon, CSS and JS) use a separate S3 prefix.
assets_prefix=cdn
url_expiry_seconds=3600
# PROD only; SAM imports the CDN base URL from the CloudFront stack.
cloudfront_enabled=false

[account]
# Selects the session adapter that shares the account database connection.
db_dialect=postgres
# Set the Secure attribute and use the __Host- prefix on session cookies.
secure_cookies=true
# Reject an account origin that uses plain HTTP.
require_https_origin=true
# Allow HTTP OAuth URLs on loopback hosts for local Google sign-in.
allow_oauth_http=false
# Allow a loopback form origin when its host and port match the request.
allow_loopback_origin=false
# Show email and authenticator codes directly on development forms.
show_verification_codes=false
# Require a mail transport for email sign-in and mandatory email verification.
require_email_delivery=true
# Enable AWS account mail delivery.
aws_email_enabled=true
# Google Login: replace LOCAL placeholders before signing in.
google_enabled = true
google_client_id = fake-local-client.apps.googleusercontent.com
google_client_secret = fake-local-secret-configure-before-use
google_redirect_uri = http://localhost:8080/user/google/callback

password_min_length=6
# Scopes account records, sessions and permissions in the shared database.
tenant=ttrek.sh
# Public site name for email subjects and authenticator apps.
issuer=ttrek.sh
# Require an image challenge for registration, password recovery and email-code requests.
registration_captcha=true
captcha_length=6
# Include letters alongside digits in image challenges.
captcha_letters=true
# Password attempt that first requires a CAPTCHA per IP (3 means after two failures, 0 disables it).
login_captcha_after=3
# Window in seconds for counting failed password attempts from the same IP.
login_captcha_window=900
# Seconds to retain expired records before pruning.
cleanup_grace_period=3600
# Session lifetime in seconds when the user selects “Stay signed in”.
persistent_session_ttl=2592000
# Require first and last names at registration.
collect_names=true
# Offer an optional public display name in the account profile.
collect_display_name=false
# Require a unique public handle. Users still sign in with email.
collect_username=false
# Keep new registrations pending until the email address is verified.
email_verification_required=true
# Send confirmation emails independently of recovery and security notices.
verification_emails_enabled=true
# Public account origin used for form-origin checks and account links.
origin=https://ttrek.sh
# Enable outgoing account mail, including recovery and security notices.
email_enabled=true
# Offer passwordless sign-in with a one-time email code.
email_login_enabled=true
# Sign in after the registration email code is verified when email login is enabled.
login_after_email_verification=true
email_from=noreply@ttrek.sh
email_region=eu-central-1
# For built-in AWS delivery, queue mail in SQS (true) or send directly via SES (false).
email_queue_enabled=true
# SSM SecureString: /ttrek_sh/prod/account/email_queue_url (queue URL, not ARN).
email_queue_url=
# Persistent SecureStrings. The AEAD keyset encrypts stored account data.
aead_keyset=
# Persistent Tink keyset for message authentication, including session cookies.
mac_keyset=
# Stable salt for keyed email lookups. Changing it changes the lookup keys.
email_hash_salt=

[forum]
title = Community discussions
# Hold new topics and replies for moderator approval before publication.
moderation = false
# Require an image challenge when creating a topic or posting a reply.
posting_captcha = false
page_size = 20

# Comma-separated emails. Apply changes with task_sync_access.
[groups]
admin =
moderator =

[permissions]
# Permissions granted to members of each group by task_sync_access.
admin = admin_dashboard.manage, forum.moderate, wiki.edit, blog.edit, users.manage, request_monitor.view
moderator = forum.moderate
