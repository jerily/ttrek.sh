[registry]
directory=registry

# Used only with ENV=PROD. LOCAL telemetry uses data/telemetry.sqlite3.
[postgres]
host=
port=5432
database=ttrek_telemetry
username=ttrek_admin
password=

[request_monitor]
master_template=request-monitor-master.html.jinja
# Omit store for memory in LOCAL mode and Valkey in PROD mode.
history_max_events=100000

[releases]
# Private distribution bucket; downloads use signed S3 URLs.
bucket=jerily-ttrek-app
region=eu-central-1
prefix=ttrek/1.2.0
version=1.2.0
url_expiry_seconds=300
source_url_expiry_seconds=300
source_prefix=ttrek/sources
checksums_file=etc/releases.json

[ssl]
certificate=
key=
[redis]
host=localhost
port=6379

username=appuser
password=
ssl_ca_file=/etc/ssl/certs/ca-certificates.crt

[content_images]
# Sources are relative to this directory; paths cannot escape it.
docs_directory=content/docs
blog_directory=content/blog
bucket=jerily-ttrek-app
region=eu-central-1
prefix=ttrek/content/images
# Browser assets (favicon, CSS and JS) use a separate S3 prefix.
assets_prefix=cdn
url_expiry_seconds=3600
# PROD only; SAM imports the CDN base URL from the CloudFront stack.
cloudfront_enabled=false
